    const video = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const debugEl = document.getElementById('debug');
    const locationStatusEl = document.getElementById('locationStatus');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let scanning = true;
    let frameCount = 0;

    debugEl.textContent = 'jsQR loaded: ' + (typeof jsQR !== 'undefined');

    // ==== SITE (which site this scanner phone belongs to) ====
    // Set by opening the scanner with ?site=SiteName in the link. It is remembered on this
    // phone, so the scanner keeps its site even if it is later opened without the ?site= part.
    const SITE_KEY = 'scanner_site';
    const SITE = (function () {
      const fromUrl = (new URL(window.location.href).searchParams.get('site') || '').trim();
      try {
        if (fromUrl) {
          localStorage.setItem(SITE_KEY, fromUrl);
          return fromUrl;
        }
        return (localStorage.getItem(SITE_KEY) || '').trim();
      } catch (e) {
        return fromUrl;
      }
    })();

    function renderSiteBanner() {
      const el = document.getElementById('siteBanner');
      if (SITE) {
        el.className = 'site-ok';
        el.textContent = '📍 Site: ' + SITE;
      } else {
        el.className = 'site-missing';
        el.innerHTML = '⚠️ No site set for this scanner' +
          '<span>Scans will be recorded under each worker\'s home department. Please open this site\'s scanner link.</span>';
      }
    }
    renderSiteBanner();

    function siteParam(site) {
      return site ? '&site=' + encodeURIComponent(site) : '';
    }

    // ==== GEOLOCATION ====
let lastLocation = null;
let locationWatchId = null;

function initLocation() {
  if (!('geolocation' in navigator)) {
    locationStatusEl.textContent = '📍 Location not supported on this device';
    return;
  }
  locationWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      lastLocation = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy
      };
      locationStatusEl.textContent = '📍 Location ready (±' + Math.round(pos.coords.accuracy) + 'm)';
    },
    (err) => {
      lastLocation = null;
      locationStatusEl.textContent = '📍 Location unavailable (' + err.message + ') — scans will still work';
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 30000 }
  );
}
initLocation();
    
    // Register Service Worker so this page can reopen offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registered'))
          .catch((err) => console.log('Service Worker registration failed:', err));
      });
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          statusEl.textContent = 'Camera ready — scanning...';
          debugEl.textContent += '\nVideo size: ' + video.videoWidth + 'x' + video.videoHeight;
          requestAnimationFrame(tick);
        };
      })
      .catch(err => {
        statusEl.textContent = 'Camera error: ' + err.message;
      });

    function tick() {
      if (!scanning) {
        requestAnimationFrame(tick);
        return;
      }
      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'attemptBoth'
        });
        frameCount++;
        if (frameCount % 30 === 0) {
          debugEl.textContent = 'jsQR loaded: true\nVideo: ' + video.videoWidth + 'x' + video.videoHeight + '\nFrames checked: ' + frameCount + '\nLast result: ' + (code ? code.data : 'none');
        }
        if (code && code.data) {
          scanning = false;
          statusEl.textContent = 'QR detected: ' + code.data;
          processScan(code.data);
        }
      } else {
        debugEl.textContent = 'Waiting for video... readyState=' + video.readyState + ' width=' + video.videoWidth;
      }
      requestAnimationFrame(tick);
    }

    function processScan(qrText) {
      let id, name, photo;
      try {
        const url = new URL(qrText);
        id = url.searchParams.get('id');
        name = url.searchParams.get('name');
        photo = url.searchParams.get('photo');
      } catch (e) {
        id = qrText.trim();
      }

      if (!id) {
        resultEl.innerHTML = '<span style="color:red;">Could not read ID from QR: ' + qrText + '</span>';
        setTimeout(resetScanner, 4000);
        return;
      }

      // The moment of the scan, kept in case the reply is lost and the scan has to be retried
      const scanTime = new Date().toISOString();

      if (!navigator.onLine) {
        queueOfflineScan(id, name, photo);
        return;
      }

      const photoHtml = photo
        ? '<img src="' + photo + '" style="width:120px;height:120px;object-fit:cover;border-radius:50%;border:4px solid #999;margin-bottom:10px;" />'
        : '';

      resultEl.innerHTML =
        '<div>' + photoHtml + '</div>' +
        '<div style="font-size:20px;color:#555;">' + (name || id) + '</div>' +
        '<div style="font-size:14px;color:#777;">Checking...</div>';

      const callbackName = 'scanResult_' + Date.now();
      let timeoutId;

      window[callbackName] = function(result) {
        clearTimeout(timeoutId);
        const color = result.color || '#555';
        const resultPhoto = result.photoUrl || photo;
        const resultPhotoHtml = resultPhoto
          ? '<img src="' + resultPhoto + '" style="width:120px;height:120px;object-fit:cover;border-radius:50%;border:4px solid white;margin-bottom:10px;" />'
          : '';
        resultEl.innerHTML =
          '<div style="background:' + color + ';color:white;border-radius:12px;padding:20px;text-align:center;">' +
          resultPhotoHtml +
          '<div style="font-size:22px;font-weight:bold;">' + result.title + '</div>' +
          '<div style="font-size:14px;margin-top:4px;">' + result.message + '</div>' +
          '</div>';
        delete window[callbackName];
        setTimeout(resetScanner, 4000);
      };

      let scanUrl = WEB_APP_URL + '?mode=scan&id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(STATION_KEY) + siteParam(SITE) + '&callback=' + callbackName + '&_=' + Date.now();
      if (lastLocation) {
        scanUrl += '&lat=' + encodeURIComponent(lastLocation.lat) + '&lng=' + encodeURIComponent(lastLocation.lng);
      }

      const script = document.createElement('script');
      script.src = scanUrl;
      script.onerror = function() {
        clearTimeout(timeoutId);
        delete window[callbackName];
        checkStatusAfterError(id, name, photo, scanTime);
      };
      document.body.appendChild(script);

      timeoutId = setTimeout(function() {
        if (window[callbackName]) {
          delete window[callbackName];
          checkStatusAfterError(id, name, photo, scanTime);
        }
        script.remove();
      }, 15000);
    }

    function checkStatusAfterError(id, name, photo, scanTime) {
      resultEl.innerHTML = '<div style="font-size:16px;color:#f57c00;">Checking if that went through...</div>';
      const callbackName = 'statusCheck_' + Date.now();
      let timeoutId;

      window[callbackName] = function(result) {
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (result.status === 'confirmed') {
          const color = result.color || '#555';
          const resultPhoto = result.photoUrl || photo;
          const resultPhotoHtml = resultPhoto
            ? '<img src="' + resultPhoto + '" style="width:120px;height:120px;object-fit:cover;border-radius:50%;border:4px solid white;margin-bottom:10px;" />'
            : '';
          resultEl.innerHTML =
            '<div style="background:' + color + ';color:white;border-radius:12px;padding:20px;text-align:center;">' +
            resultPhotoHtml +
            '<div style="font-size:20px;font-weight:bold;">✓ Actually went through</div>' +
            '<div style="font-size:14px;margin-top:4px;">' + result.message + '</div>' +
            '</div>';
        setTimeout(resetScanner, 4000);
      } else {
        // Not recorded yet: keep it and retry in the background
        queueRetryScan(id, name, photo, scanTime);
      }
    };

      let statusUrl = WEB_APP_URL + '?mode=status&id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(STATION_KEY) + '&callback=' + callbackName + '&_=' + Date.now();
      const script = document.createElement('script');
      script.src = statusUrl;
      script.onerror = function() {
        clearTimeout(timeoutId);
        delete window[callbackName];
        // Could not check either: keep the scan and retry in the background
        queueRetryScan(id, name, photo, scanTime);
      };
      document.body.appendChild(script);

      timeoutId = setTimeout(function() {
        if (window[callbackName]) {
          delete window[callbackName];
          queueRetryScan(id, name, photo, scanTime);
        }
        script.remove();
      }, 10000);
    }

    function resetScanner() {
      resultEl.innerHTML = '';
      statusEl.textContent = 'Camera ready — scanning...';
      scanning = true;

      // Safety check: if video has stopped delivering frames, restart the stream
      if (!video.srcObject || video.readyState < 2) {
        statusEl.textContent = 'Restarting camera...';
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            video.srcObject = stream;
            video.play();
            statusEl.textContent = 'Camera ready — scanning...';
          })
          .catch(err => {
            statusEl.textContent = 'Camera error: ' + err.message;
          });
      }
    }
    let selectedEmployeeId = null;

    let searchListenerAttached = false;

   function openForgotQR() {
     document.getElementById('forgotModal').style.display = 'block';
     document.getElementById('manualStatusStep').style.display = 'none';
     renderEmployeeList(ROSTER);
     document.getElementById('employeeSearch').value = '';

     if (!searchListenerAttached) {
       document.getElementById('employeeSearch').addEventListener('input', function() {
         const q = this.value.toLowerCase();
         renderEmployeeList(ROSTER.filter(e => e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q)));
       });
       searchListenerAttached = true;
     }
   }

    function closeForgotQR() {
      document.getElementById('forgotModal').style.display = 'none';
      selectedEmployeeId = null;
    }

    function renderEmployeeList(list) {
      const container = document.getElementById('employeeList');
      container.innerHTML = list.map(emp =>
        '<div onclick="selectEmployee(\'' + emp.id + '\', \'' + emp.name.replace(/'/g, "\\'") + '\')" style="display:flex;align-items:center;padding:8px;border-bottom:1px solid #eee;cursor:pointer;">' +
        (emp.photo ? '<img src="' + emp.photo + '" style="width:40px;height:40px;border-radius:50%;object-fit:cover;margin-right:10px;">' : '') +
        '<span>' + emp.name + ' (' + emp.id + ')</span></div>'
      ).join('');
    }

    let selectedEmployeeName = null;

    function selectEmployee(id, name) {
      selectedEmployeeId = id;
      selectedEmployeeName = name;
      document.getElementById('selectedEmployeeName').textContent = name + ' (' + id + ')';
      document.getElementById('manualStatusStep').style.display = 'block';
    }
    function submitManual(status) {
      if (!selectedEmployeeId) return;
      const id = selectedEmployeeId;
      const name = selectedEmployeeName;
      const entryTime = new Date().toISOString();
      closeForgotQR();

      // Check if we're offline — if so, queue this manual entry instead
      if (!navigator.onLine) {
        queueOfflineManual(id, name, status);
        return;
      }

      resultEl.innerHTML = '<div style="font-size:16px;color:#777;">Submitting ' + status + ' for ' + name + '...</div>';

      const callbackName = 'manualResult_' + Date.now();
      let timeoutId;
      let finished = false;

      function lost() {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        // Reply lost: keep it and retry in the background (the server ignores repeats)
        queueRetryManual(id, name, status, entryTime);
      }

      window[callbackName] = function(result) {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (result && result.status === 'success') {
          const color = status === 'Time In' ? '#2e7d32' : '#c62828';
          resultEl.innerHTML =
            '<div style="background:' + color + ';color:white;border-radius:12px;padding:20px;text-align:center;">' +
            '<div style="font-size:22px;font-weight:bold;">' + status + ' Recorded (Manual)</div>' +
            '<div style="font-size:14px;margin-top:4px;">' + name + (SITE ? ' • ' + SITE : '') + '</div>' +
            '</div>';
        } else {
          resultEl.innerHTML =
            '<div style="background:#d32f2f;color:white;border-radius:12px;padding:20px;text-align:center;">' +
            '<div style="font-size:20px;font-weight:bold;">Not recorded</div>' +
            '<div style="font-size:14px;margin-top:4px;">' + ((result && result.title) || 'Please try again.') + '</div>' +
            '</div>';
        }
        setTimeout(resetScanner, 4000);
      };

      let url = WEB_APP_URL + '?mode=manual&id=' + encodeURIComponent(id) + '&status=' + encodeURIComponent(status) +
        '&key=' + encodeURIComponent(STATION_KEY) + '&clientTime=' + encodeURIComponent(entryTime) + siteParam(SITE);
      if (lastLocation) {
        url += '&lat=' + encodeURIComponent(lastLocation.lat) + '&lng=' + encodeURIComponent(lastLocation.lng);
      }
      url += '&callback=' + callbackName + '&_=' + Date.now();

      const script = document.createElement('script');
      script.src = url;
      script.onerror = lost;
      document.body.appendChild(script);
      timeoutId = setTimeout(function() { lost(); script.remove(); }, 15000);
    }

    // ==== OFFLINE QUEUE ====
    const QUEUE_KEY = 'attendance_offline_queue';

    function getQueue() {
      try {
        return JSON.parse(localStorage.getItem(QUEUE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function countTodayQueueEntriesForId(id) {
      const queue = getQueue();
      const today = new Date().toDateString();
      return queue.filter(function(item) {
        return item.id === id && new Date(item.timestamp).toDateString() === today;
      }).length;
    }

    function getLastQueueTimestampForId(id) {
      const queue = getQueue();
      const matches = queue.filter(function(item) { return item.id === id; });
      if (matches.length === 0) return null;
      return new Date(matches[matches.length - 1].timestamp);
    }

    function saveQueue(queue) {
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      updateQueueBadge();
    }

    function queueOfflineScan(id, name, photo) {
      // Cooldown check — block if this ID was queued within the last 60 seconds
      const lastTime = getLastQueueTimestampForId(id);
      if (lastTime) {
        const secondsSince = (new Date().getTime() - lastTime.getTime()) / 1000;
        if (secondsSince < 60) {
          resultEl.innerHTML =
            '<div style="font-size:20px;color:#f9a825;">Already Queued</div>' +
            '<div style="font-size:14px;margin-top:4px;">' + (name || id) + ', your last scan was just ' + Math.round(secondsSince) + ' second(s) ago.</div>';
          setTimeout(resetScanner, 4000);
          return;
        }
      }

      // One Time In + one Time Out per day check
      const todayCount = countTodayQueueEntriesForId(id);
      if (todayCount >= 2) {
        resultEl.innerHTML =
          '<div style="font-size:20px;color:#6a1b9a;">Already Completed</div>' +
          '<div style="font-size:14px;margin-top:4px;">' + (name || id) + ' already has Time In and Time Out queued for today.</div>';
        setTimeout(resetScanner, 4000);
        return;
      }

      const queue = getQueue();
      queue.push({
        id: id,
        name: name || id,
        photo: photo || '',
        lat: lastLocation ? lastLocation.lat : null,
        lng: lastLocation ? lastLocation.lng : null,
        site: SITE,
        timestamp: new Date().toISOString()
      });
      saveQueue(queue);

      resultEl.innerHTML =
        '<div style="font-size:20px;color:#f57c00;">📥 Saved Offline</div>' +
        '<div style="font-size:16px;margin-top:4px;">' + (name || id) + '</div>' +
        '<div style="font-size:13px;color:#777;margin-top:4px;">Will sync once internet is back. (' + queue.length + ' pending)</div>';

      setTimeout(resetScanner, 4000);
    }

    function queueOfflineManual(id, name, status) {
      const todayCount = countTodayQueueEntriesForId(id);
      if (todayCount >= 2) {
        resultEl.innerHTML =
          '<div style="font-size:20px;color:#6a1b9a;">Already Completed</div>' +
          '<div style="font-size:14px;margin-top:4px;">' + (name || id) + ' already has Time In and Time Out queued for today.</div>';
        setTimeout(resetScanner, 4000);
        return;
      }

      const queue = getQueue();
      queue.push({
        id: id,
        name: name || id,
        status: status,
        isManual: true,
        lat: lastLocation ? lastLocation.lat : null,
        lng: lastLocation ? lastLocation.lng : null,
        site: SITE,
        timestamp: new Date().toISOString()
      });
      saveQueue(queue);

      resultEl.innerHTML =
        '<div style="font-size:20px;color:#f57c00;">📥 Saved Offline (Manual)</div>' +
        '<div style="font-size:16px;margin-top:4px;">' + (name || id) + ' — ' + status + '</div>' +
        '<div style="font-size:13px;color:#777;margin-top:4px;">Will sync once internet is back. (' + queue.length + ' pending)</div>';

      setTimeout(resetScanner, 4000);
    }

    // ==== RETRY WHEN A REPLY IS LOST (unstable or switching connection) ====
    // The scan keeps its original time. The server ignores repeats of the same scan,
    // so a retry never creates a second entry, even if the first attempt went through.
    function queueRetryItem(item, label) {
      const queue = getQueue();
      queue.push(item);
      saveQueue(queue);

      resultEl.innerHTML =
        '<div style="background:#f57c00;color:white;border-radius:12px;padding:20px;text-align:center;">' +
        '<div style="font-size:20px;font-weight:bold;">⏳ Saved — will confirm when the connection is stable</div>' +
        '<div style="font-size:14px;margin-top:4px;">' + label + '</div>' +
        '<div style="font-size:12px;margin-top:6px;">No need to scan again. (' + queue.length + ' pending)</div>' +
        '</div>';

      setTimeout(resetScanner, 4000);
      setTimeout(syncOfflineQueue, 5000);
    }

    function queueRetryScan(id, name, photo, scanTime) {
      queueRetryItem({
        id: id,
        name: name || id,
        photo: photo || '',
        lat: lastLocation ? lastLocation.lat : null,
        lng: lastLocation ? lastLocation.lng : null,
        site: SITE,
        timestamp: scanTime
      }, name || id);
    }

    function queueRetryManual(id, name, status, entryTime) {
      queueRetryItem({
        id: id,
        name: name || id,
        status: status,
        isManual: true,
        lat: lastLocation ? lastLocation.lat : null,
        lng: lastLocation ? lastLocation.lng : null,
        site: SITE,
        timestamp: entryTime
      }, (name || id) + ' — ' + status + ' (Manual)');
    }

    function updateQueueBadge() {
      const queue = getQueue();
      let badge = document.getElementById('queueBadge');
      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'queueBadge';
        badge.style.cssText = 'position:fixed;top:10px;right:10px;background:#f57c00;color:white;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold;z-index:1000;';
        document.body.appendChild(badge);
      }
      if (queue.length > 0) {
        badge.style.display = 'block';
        badge.textContent = queue.length + ' pending';
      } else {
        badge.style.display = 'none';
      }
    }

    let isSyncing = false;

    function syncOfflineQueue() {
      if (isSyncing || !navigator.onLine) return;   // never run two syncs at once
      const queue = getQueue();
      if (queue.length === 0) return;

      isSyncing = true;
      let badge = document.getElementById('queueBadge');
      if (badge) badge.textContent = 'Syncing...';

      syncNext(queue, 0);
    }

    // Remove only the items that were sent; keep anything saved while syncing
    function finishSync(sentCount) {
      saveQueue(getQueue().slice(sentCount));
      isSyncing = false;
    }

    function syncNext(queue, index) {
      if (index >= queue.length) {
        finishSync(queue.length);
        return;
      }
      const item = queue[index];
      const callbackName = 'syncResult_' + Date.now() + '_' + index;
      let done = false;
      let timeoutId;
      let script;

      // No reply (connection dropped again): stop here and try the rest later
      function stop() {
        if (done) return;
        done = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script) script.remove();
        finishSync(index);
      }

      window[callbackName] = function(result) {
        if (done) return;
        done = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script) script.remove();
        if (result && result.title === 'Busy') {   // server was busy: keep it for the next try
          finishSync(index);
          return;
        }
        syncNext(queue, index + 1);
      };

      let src;
      if (item.isManual) {
        src = WEB_APP_URL + '?mode=manual&id=' + encodeURIComponent(item.id) +
          '&status=' + encodeURIComponent(item.status) +
          '&key=' + encodeURIComponent(STATION_KEY) +
          '&clientTime=' + encodeURIComponent(item.timestamp) +
          '&callback=' + callbackName + '&_=' + Date.now();
      } else {
        src = WEB_APP_URL + '?mode=scan&id=' + encodeURIComponent(item.id) +
          '&key=' + encodeURIComponent(STATION_KEY) +
          '&clientTime=' + encodeURIComponent(item.timestamp) +
          '&callback=' + callbackName + '&_=' + Date.now();
      }

      if (item.lat != null && item.lng != null) {
        src += '&lat=' + encodeURIComponent(item.lat) + '&lng=' + encodeURIComponent(item.lng);
      }
      src += siteParam(item.site);

      script = document.createElement('script');
      script.src = src;
      script.onerror = stop;
      document.body.appendChild(script);
      timeoutId = setTimeout(stop, 15000);
    }

    // Watch for connection changes
    window.addEventListener('online', syncOfflineQueue);

    // On a weak connection the phone may stay "online" while requests fail,
    // so also retry pending items every 20 seconds
    setInterval(function() {
      if (getQueue().length > 0) syncOfflineQueue();
    }, 20000);
    window.addEventListener('load', function() {
      updateQueueBadge();
      if (navigator.onLine) syncOfflineQueue();
    });
  </script>
  <div id="forgotModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999;overflow-y:auto;">
     <div style="background:white;max-width:500px;margin:30px auto;padding:20px;border-radius:8px;">
       <h3>Select Employee</h3>
       <input type="text" id="employeeSearch" placeholder="Search name..." style="width:100%;padding:8px;margin-bottom:10px;box-sizing:border-box;">
       <div id="employeeList" style="max-height:300px;overflow-y:auto;"></div>
       <div id="manualStatusStep" style="display:none;margin-top:15px;">
         <p id="selectedEmployeeName" style="font-weight:bold;"></p>
         <button onclick="submitManual('Time In')" style="padding:12px 20px;background:#2e7d32;color:white;border:none;border-radius:6px;margin-right:10px;">Time In</button>
         <button onclick="submitManual('Time Out')" style="padding:12px 20px;background:#1565c0;color:white;border:none;border-radius:6px;">Time Out</button>
       </div>
       <button onclick="closeForgotQR()" style="margin-top:15px;padding:8px 16px;background:#999;color:white;border:none;border-radius:6px;">Cancel</button>
     </div>
   </div>
</body>
